[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # chrono is unmaintained (no fixed release exists). Pulled in only
    # transitively by lopdf 0.44; not a vulnerability. Revisit when lopdf drops it.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained-only, transitive via lopdf, no upgrade available" },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "IJG",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
